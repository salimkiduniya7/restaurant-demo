<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Royal Spice Restaurant</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f4f4;
padding-bottom:120px;
}

header{
background:#111827;
color:white;
padding:20px;
text-align:center;
position:sticky;
top:0;
z-index:100;
}

header h1{
font-size:28px;
}

header p{
margin-top:5px;
opacity:.8;
}

.table-info{
background:white;
padding:15px;
margin:15px;
border-radius:12px;
box-shadow:0 3px 8px rgba(0,0,0,.1);
}

.table-info input{
width:100%;
padding:12px;
margin-top:10px;
border:1px solid #ddd;
border-radius:8px;
}

.categories{
display:flex;
overflow-x:auto;
gap:10px;
padding:15px;
}

.categories button{
border:none;
background:#111827;
color:white;
padding:10px 15px;
border-radius:20px;
cursor:pointer;
white-space:nowrap;
}

.menu-section{
padding:15px;
}

.menu-title{
font-size:24px;
margin-bottom:15px;
}

.menu-grid{
display:grid;
grid-template-columns:1fr;
gap:15px;
}

.item{
background:white;
padding:15px;
border-radius:12px;
box-shadow:0 3px 8px rgba(0,0,0,.1);
}

.item h3{
margin-bottom:8px;
}

.price{
color:green;
font-weight:bold;
margin-bottom:12px;
}

.controls{
display:flex;
justify-content:space-between;
align-items:center;
}

.qty{
display:flex;
align-items:center;
gap:10px;
}

.qty button{
width:35px;
height:35px;
border:none;
background:#111827;
color:white;
font-size:18px;
border-radius:50%;
cursor:pointer;
}

.add-btn{
background:#16a34a;
color:white;
border:none;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
}

.cart{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
padding:15px;
box-shadow:0 -4px 10px rgba(0,0,0,.15);
}

.cart textarea{
width:100%;
padding:10px;
border-radius:8px;
margin-top:10px;
border:1px solid #ddd;
}

.cart button{
width:100%;
margin-top:10px;
padding:14px;
border:none;
background:#2563eb;
color:white;
font-size:16px;
border-radius:10px;
cursor:pointer;
}

#cartItems{
margin-top:10px;
max-height:120px;
overflow:auto;
}

.cart-item{
display:flex;
justify-content:space-between;
margin-bottom:5px;
}

</style>
</head>

<body>

<header>
<h1>Royal Spice Restaurant</h1>
<p>Table 5</p>
</header>

<div class="table-info">
<h3>Customer Information</h3>

<input
type="text"
id="customerName"
placeholder="Enter Your Name">
</div>

<div class="categories">

<button>Starters</button>
<button>Burgers</button>
<button>Pizza</button>
<button>Main Course</button>
<button>Drinks</button>
<button>Desserts</button>

</div>

<div class="menu-section">

<h2 class="menu-title">Menu</h2>

<div class="menu-grid" id="menuGrid">

</div>

</div>

<div class="cart">

<h3>Cart</h3>

<div id="cartItems"></div>

<h4 id="totalPrice">Total: 0 AED</h4>

<textarea
id="note"
placeholder="Special Notes (Extra Onion, No Tomato etc)">
</textarea>

<button onclick="placeOrder()">
Place Order
</button>

</div>

<script>

const menu = [

{name:"French Fries",price:8},
{name:"Peri Peri Fries",price:10},
{name:"Garlic Bread",price:9},
{name:"Chicken Wings",price:15},
{name:"Spring Rolls",price:12},

{name:"Classic Burger",price:18},
{name:"Cheese Burger",price:22},
{name:"Double Beef Burger",price:28},
{name:"Chicken Burger",price:20},

{name:"Margherita Pizza",price:25},
{name:"Pepperoni Pizza",price:30},
{name:"Chicken Pizza",price:32},
{name:"Veggie Pizza",price:24},

{name:"Chicken Biryani",price:22},
{name:"Mutton Biryani",price:28},
{name:"Butter Chicken",price:30},
{name:"Chicken Karahi",price:32},
{name:"Mix Grill",price:45},

{name:"Pepsi",price:4},
{name:"Coca Cola",price:4},
{name:"Sprite",price:4},
{name:"Orange Juice",price:8},
{name:"Mango Juice",price:8},
{name:"Water",price:2},

{name:"Ice Cream",price:8},
{name:"Chocolate Cake",price:12},
{name:"Brownie",price:10}

];

let cart = [];

const menuGrid =
document.getElementById("menuGrid");

menu.forEach(item=>{

const div=document.createElement("div");

div.className="item";

div.innerHTML=`

<h3>${item.name}</h3>

<div class="price">
${item.price} AED
</div>

<div class="controls">

<button
class="add-btn"
onclick='addToCart("${item.name}",${item.price})'>

Add To Cart

</button>

</div>

`;

menuGrid.appendChild(div);

});

function addToCart(name,price){

cart.push({
name,
price
});

renderCart();

}

function renderCart(){

const cartItems=
document.getElementById("cartItems");

cartItems.innerHTML="";

let total=0;

cart.forEach(item=>{

total+=item.price;

cartItems.innerHTML+=`

<div class="cart-item">

<span>${item.name}</span>

<span>${item.price} AED</span>

</div>

`;

});

document.getElementById("totalPrice")
.innerText=
`Total: ${total} AED`;

}

function placeOrder(){

const customer =
document.getElementById("customerName").value;

if(!customer){

alert("Enter Name");

return;

}

if(cart.length===0){

alert("Cart Empty");

return;

}

alert(
"Demo Order Placed Successfully!"
);

}

</script>

</body>
</html>
